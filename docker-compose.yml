services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_jira_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_jira_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n:latest
    container_name: ai_jira_n8n
    restart: unless-stopped
    network_mode: host
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - BACKEND_INTERNAL_URL=http://localhost:5000
      - INTERNAL_SERVICE_KEY=ai_jira_agent_internal_secret_2026
      - FLOW10_WEBHOOK_KEY=ai_jira_agent_flow10_webhook_secret_key_2026
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data:
