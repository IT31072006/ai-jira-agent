name: Auto Deploy to VPS

# Chỉ kích hoạt khi có commit mới được PUSH hoặc MERGE vào nhánh main
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Executing remote SSH commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "🚀 [1/4] Kéo mã nguồn mới nhất từ nhánh main..."
            cd /root/ai-jira-agent
            git fetch origin main
            git checkout -f main
            git reset --hard origin/main

            echo "🐳 [2/5] Đảm bảo container Database (PostgreSQL) và n8n luôn hoạt động..."
            cd /root/ai-jira-agent
            docker compose up -d

            echo "📦 [3/5] Cập nhật Backend & chạy Database Migrations..."
            cd /root/ai-jira-agent/backend
            npm install
            npm run migrate
            pm2 restart jira-backend --update-env

            echo "🎨 [4/5] Cài đặt & Build lại Frontend..."
            cd /root/ai-jira-agent/frontend
            npm install
            npm run build

            echo "🔄 [5/5] Khởi động lại dịch vụ Web Nginx..."
            systemctl reload nginx

            echo "✅ Web đã được cập nhật thành công lên phiên bản mới nhất!"
